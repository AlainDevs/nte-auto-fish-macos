name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          PYTHONPATH=. pytest --cov=nte_fisher

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMG
        run: |
          chmod +x scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Zip App Bundle
        run: |
          cd dist
          zip -r "NTE Auto Fisher.app.zip" "NTE Auto Fisher.app"

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }} # Uses the tag name if triggered by tag, otherwise branch name (e.g. main)
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            dist/NTE Auto Fisher.app.zip
            dist/NTE Auto Fisher.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
